<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ส่งผู้ป่วยเข้าสู่บริการ Home Ward</title>
<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --primary-light: #e0f2fe;
    --bg-page: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #cbd5e1;
    --danger: #ef4444;
    --success: #10b981;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: "Sarabun", sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    padding-bottom: 24px;
    line-height: 1.4;
  }

  /* Header */
  .app-header {
    background: linear-gradient(135deg, #0284c7, #0f766e);
    color: #ffffff;
    padding: 14px 16px;
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
    box-shadow: var(--shadow-sm);
  }
  .app-header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }
  .app-header p {
    margin: 2px 0 0;
    font-size: 12px;
    opacity: 0.9;
  }

  /* Form Container */
  .form-container {
    max-width: 480px;
    margin: 8px auto 0;
    padding: 0 12px;
  }

  /* Card */
  .card-section {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  /* Scanner Box */
  .scanner-card {
    background: #f0fdfa;
    border: 1.5px dashed #14b8a6;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .scanner-card:active { background: #ccfbf1; }
  .scanner-icon { font-size: 20px; }
  .scanner-text-group { text-align: left; }
  .scanner-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #0f766e;
  }
  .scanner-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Field Groups */
  .field {
    margin-bottom: 10px;
  }
  .field:last-child {
    margin-bottom: 0;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 4px;
  }
  label .req {
    color: var(--danger);
    margin-left: 2px;
  }

  input[type="text"],
  input[type="tel"],
  input[type="number"],
  select {
    width: 100%;
    padding: 9px 12px;
    border: 1.2px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
    background: #ffffff;
    color: var(--text-main);
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
  }
  select {
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 14px;
  }

  /* Grid 2 คอลัมน์สำหรับ HN และ อายุ */
  .field-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .field-row .field { margin-bottom: 0; }

  /* Indication เรียงบรรทัดละข้อ */
  .indication-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .indication-pill {
    position: relative;
  }
  .indication-pill input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    margin: 0;
  }
  .indication-label {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    background: #f8fafc;
    border: 1.2px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .indication-label::before {
    content: "";
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 1.5px solid #94a3b8;
    margin-right: 8px;
    display: inline-block;
  }
  .indication-pill input:checked + .indication-label {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary-dark);
    font-weight: 600;
  }
  .indication-pill input:checked + .indication-label::before {
    border-color: var(--primary);
    background-color: var(--primary);
    box-shadow: inset 0 0 0 2px #ffffff;
  }

  /* Submit Button */
  .submit-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
    margin-top: 4px;
  }
  .submit-btn:disabled {
    background: #cbd5e1;
    box-shadow: none;
    cursor: not-allowed;
  }

  /* Footnote Style */
  .app-footnote {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 14px;
    padding: 4px 8px;
    line-height: 1.5;
  }

  /* Success Screen */
  #successScreen {
    display: none;
    padding: 40px 20px;
    text-align: center;
  }
  .success-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #dcfce7;
    color: var(--success);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 12px;
  }

  /* Modern Loading Overlay */
  #loadingOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .loading-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  #loadingText {
    font-size: 13px;
    color: var(--text-main);
    font-weight: 600;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="app-header">
  <h1>📋 ส่งผู้ป่วย admit Home Ward รพ.สุโขทัย</h1>
  <p>กรอกข้อมูลหรือถ่ายภาพ OPD Card เพื่อส่งต่อเคส</p>
</header>

<div class="form-container">
  <form id="caseForm">

    <!-- ถ่ายภาพ OPD Card แบบกะทัดรัด -->
    <div class="card-section" style="padding: 6px;">
      <label class="scanner-card" for="opdCamera">
        <div class="scanner-icon">📸</div>
        <div class="scanner-text-group">
          <div class="scanner-title">ถ่ายภาพ OPD Card / สติกเกอร์ผู้ป่วย</div>
          <div class="scanner-sub">ระบบจะอ่าน HN, ชื่อ, อายุ เติมให้อัตโนมัติ</div>
        </div>
        <input type="file" id="opdCamera" accept="image/*" capture="environment" style="display:none;">
      </label>
    </div>

    <!-- ข้อมูลผู้ป่วย -->
    <div class="card-section">
      <div class="field">
        <label>ชื่อ-นามสกุลผู้ป่วย<span class="req">*</span></label>
        <input type="text" id="fullName" required placeholder="ระบุชื่อและนามสกุล">
      </div>

      <div class="field-row">
        <div class="field">
          <label>HN (9 หลัก)<span class="req">*</span></label>
          <input type="text" id="hn" required placeholder="000123456" inputmode="numeric" maxlength="9" pattern="\d{9}">
        </div>
        <div class="field">
          <label>อายุ (ปี)<span class="req">*</span></label>
          <input type="number" id="age" required min="0" max="130" placeholder="เช่น 65">
        </div>
      </div>

      <div class="field">
        <label>สิทธิ์การรักษา<span class="req">*</span></label>
        <select id="rights" required>
          <option value="" disabled selected>เลือกสิทธิ์การรักษา</option>
          <option value="บัตรทอง (UC)">บัตรทอง (UC)</option>
          <option value="ประกันสังคม">ประกันสังคม</option>
          <option value="เบิกตรงข้าราชการ">เบิกตรงข้าราชการ</option>
        </select>
      </div>

      <div class="field">
        <label>เบอร์โทรศัพท์ติดต่อ<span class="req">*</span></label>
        <input type="tel" id="phone" required placeholder="08X-XXX-XXXX" inputmode="tel">
      </div>
    </div>

    <!-- ข้อบ่งชี้ (เรียงบรรทัดละข้อ) -->
    <div class="card-section">
      <label>ข้อบ่งชี้หลัก (เลือก 1 ข้อ)<span class="req">*</span></label>
      <div class="indication-list">
        <div class="indication-pill">
          <input type="radio" name="indication" id="ind1" value="Pressure injury" required>
          <label class="indication-label" for="ind1">Pressure injury</label>
        </div>
        <div class="indication-pill">
          <input type="radio" name="indication" id="ind2" value="UTI">
          <label class="indication-label" for="ind2">UTI</label>
        </div>
        <div class="indication-pill">
          <input type="radio" name="indication" id="ind3" value="Pneumonia">
          <label class="indication-label" for="ind3">Pneumonia</label>
        </div>
        <div class="indication-pill">
          <input type="radio" name="indication" id="ind4" value="COVID">
          <label class="indication-label" for="ind4">COVID</label>
        </div>
        <div class="indication-pill">
          <input type="radio" name="indication" id="ind5" value="Active dying">
          <label class="indication-label" for="ind5">Active dying</label>
        </div>
      </div>
    </div>

    <!-- หน่วยบริการต้นทาง -->
    <div class="card-section">
      <div class="field">
        <label>หน่วยบริการที่ส่งต่อ<span class="req">*</span></label>
        <select id="setting" required>
          <option value="" disabled selected>เลือกหน่วยบริการ</option>
          <option value="OPD">OPD</option>
          <option value="IPD">IPD</option>
          <option value="ER">ER</option>
        </select>
      </div>

      <div class="field" id="wardField" style="display: none;">
        <label>ระบุ Ward ต้นทาง<span class="req">*</span></label>
        <input type="text" id="ward" placeholder="เช่น อายุรกรรมชาย 1, ตึกศัลยกรรม">
      </div>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">บันทึกและส่งข้อมูล</button>

    <!-- Footnote ส่วนท้ายของแบบฟอร์ม -->
    <div class="app-footnote">
      โดย กลุ่มงานพยาบาลชุมชน & แพทย์เวชศาสตร์ครอบครัว รพ.สุโขทัย
    </div>
  </form>
</div>

<!-- หน้าต่างสำเร็จ -->
<div id="successScreen">
  <div class="success-icon">✓</div>
  <h2 style="font-size: 18px; margin: 0 0 6px;">ส่งข้อมูลสำเร็จ</h2>
  <p style="font-size: 13.5px; color: var(--text-muted); margin: 0 0 20px;">ทีมงานได้รับข้อมูลเรียบร้อยแล้ว</p>
  <button class="submit-btn" style="width: auto; padding: 10px 24px;" onclick="closeLiff()">ปิด / กรอกเคสใหม่</button>
  <div class="app-footnote" style="margin-top: 24px;">
    โดย กลุ่มงานพยาบาลชุมชน & แพทย์เวชศาสตร์ครอบครัว รพ.สุโขทัย
  </div>
</div>

<!-- หน้าต่าง Loading -->
<div id="loadingOverlay">
  <div class="loading-card">
    <div class="spinner"></div>
    <div id="loadingText">กำลังประมวลผล...</div>
  </div>
</div>

<script>
  const LIFF_ID = "2011323423-D42WYaU4";
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxI-AZFsQvl0PT5OwO2m2lrEn_s-Q6JNJtNK0jIanIpcVtBkA5ShQyxA3XQ5I44X9ui/exec";

  let lineProfile = { userId: "", displayName: "" };

  async function initLiff() {
    try {
      if (typeof liff !== "undefined" && LIFF_ID) {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineProfile.userId = profile.userId;
          lineProfile.displayName = profile.displayName;
        }
      }
    } catch (err) {
      console.log("LIFF Init / Browser mode:", err);
    }
  }
  initLiff();
  
  function closeLiff() {
    if (typeof liff !== "undefined" && liff.isInClient()) {
      liff.closeWindow();
    } else {
      window.location.reload();
    }
  }

  const form = document.getElementById("caseForm");
  const submitBtn = document.getElementById("submitBtn");
  const loadingOverlay = document.getElementById("loadingOverlay");
  const loadingText = document.getElementById("loadingText");
  const settingSelect = document.getElementById("setting");
  const wardField = document.getElementById("wardField");
  const wardInput = document.getElementById("ward");
  const opdCamera = document.getElementById("opdCamera");

  // แสดง/ซ่อน ช่อง Ward
  settingSelect.addEventListener("change", (e) => {
    if (e.target.value === "IPD") {
      wardField.style.display = "block";
      wardInput.required = true;
    } else {
      wardField.style.display = "none";
      wardInput.required = false;
      wardInput.value = "";
    }
  });

  // OCR ดึงข้อมูลภาพ
  opdCamera.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    loadingText.innerText = "กำลังอ่านข้อมูลจากภาพ...";
    loadingOverlay.style.display = "flex";

    try {
      const base64Image = await resizeImage(file, 1600);

      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "ocr_scan",
          imageBase64: base64Image
        })
      });

      const result = await res.json();

      if (result.status === "success" && result.data) {
        const extracted = result.data;
        let filledCount = 0;

        if (extracted.fullName) {
          document.getElementById("fullName").value = extracted.fullName;
          filledCount++;
        }
        if (extracted.hn) {
          document.getElementById("hn").value = extracted.hn;
          filledCount++;
        }
        if (extracted.age) {
          document.getElementById("age").value = extracted.age;
          filledCount++;
        }

        if (filledCount > 0) {
          Swal.fire({
            icon: 'success',
            title: 'ดึงข้อมูลสำเร็จ',
            text: 'ระบบเติมข้อมูลให้เรียบร้อย กรุณาตรวจทานความถูกต้อง',
            confirmButtonColor: '#0284c7',
            confirmButtonText: 'ตกลง'
          });
        } else {
          Swal.fire({
            icon: 'info',
            title: 'อ่านภาพได้ แต่ไม่พบข้อมูล',
            text: 'กรุณากรอกข้อมูลเพิ่มเติมด้วยตนเอง',
            confirmButtonColor: '#0284c7',
            confirmButtonText: 'ตกลง'
          });
        }
      } else {
        throw new Error(result.message || "Parse failed");
      }
    } catch (err) {
      console.error("OCR Error:", err);
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาด',
        text: 'ไม่สามารถอ่านข้อความจากภาพได้ กรุณากรอกข้อมูลด้วยตนเอง',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
    } finally {
      loadingOverlay.style.display = "none";
      opdCamera.value = "";
    }
  });

  function resizeImage(file, maxDimension) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDimension) {
              height = Math.round((height *= maxDimension / width));
              width = maxDimension;
            }
          } else {
            if (height > maxDimension) {
              width = Math.round((width *= maxDimension / height));
              height = maxDimension;
            }
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ส่งแบบฟอร์ม
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const rightsVal = document.getElementById("rights").value;
    if (rightsVal !== "บัตรทอง (UC)") {
      Swal.fire({
        icon: 'warning',
        title: 'แจ้งเตือนสิทธิ์การรักษา',
        text: 'ผู้ป่วยที่สามารถเข้ารับบริการนี้ต้องเป็นสิทธิ์ UC เท่านั้น',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'รับทราบ'
      });
      return;
    }

    const hnVal = document.getElementById("hn").value.trim();
    if (!/^\d{9}$/.test(hnVal)) {
      Swal.fire({
        icon: 'warning',
        title: 'เลข HN ไม่ถูกต้อง',
        text: 'กรุณากรอกเลข HN ให้เป็นตัวเลขครบ 9 หลัก',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
      return;
    }

    const selectedIndication = document.querySelector('input[name="indication"]:checked');
    if (!selectedIndication) {
      Swal.fire({
        icon: 'warning',
        title: 'ข้อมูลไม่ครบถ้วน',
        text: 'กรุณาเลือกข้อบ่งชี้ 1 ข้อ',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
      return;
    }

    const payload = {
      userId: lineProfile.userId || "",
      displayName: lineProfile.displayName || "Web Browser",
      fullName: document.getElementById("fullName").value.trim(),
      hn: hnVal,
      age: document.getElementById("age").value,
      rights: rightsVal,
      indication: selectedIndication.value,
      phone: document.getElementById("phone").value.trim(),
      setting: settingSelect.value,
      ward: settingSelect.value === "IPD" ? wardInput.value.trim() : ""
    };

    submitBtn.disabled = true;
    loadingText.innerText = "กำลังบันทึกข้อมูล...";
    loadingOverlay.style.display = "flex";

    try {
      await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      document.querySelector(".form-container").style.display = "none";
      document.querySelector(".app-header").style.display = "none";
      document.getElementById("successScreen").style.display = "block";
    } catch (err) {
      console.error("Submit error", err);
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาด',
        text: 'ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
      submitBtn.disabled = false;
    } finally {
      loadingOverlay.style.display = "none";
    }
  });
</script>

</body>
</html>
