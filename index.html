<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ระบบ Admit Home Ward รพ.สุโขทัย</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --primary-light: #e0f2fe;
    --bg-page: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #cbd5e1;
    --danger: #ef4444;
    --success: #10b981;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Sarabun", sans-serif; background-color: var(--bg-page); color: var(--text-main); padding-bottom: 24px; line-height: 1.4; }

  .app-header { background: linear-gradient(135deg, #0284c7, #0f766e); color: #ffffff; padding: 14px 16px; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; box-shadow: var(--shadow-sm); }
  .app-header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .app-header p { margin: 2px 0 0; font-size: 12px; opacity: 0.9; }

  .form-container { max-width: 480px; margin: 8px auto 0; padding: 0 12px; }
  .card-section { background: var(--card-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }

  /* ปุ่มกดเลือก 2 ปุ่ม */
  .scanner-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .scanner-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 8px;
    background: #f0fdfa;
    border: 1.5px dashed #14b8a6;
    border-radius: 10px;
    color: #0f766e;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }
  .scanner-btn:active { background: #ccfbf1; }

  #previewContainer { display: none; margin-top: 10px; text-align: center; }
  #imagePreview { max-width: 100%; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); }

  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  label .req { color: var(--danger); margin-left: 2px; }

  input[type="text"], input[type="tel"], input[type="number"], select {
    width: 100%; padding: 9px 12px; border: 1.2px solid var(--border); border-radius: 8px; font-size: 13.5px;
    background: #ffffff; color: var(--text-main); -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15); }
  select {
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
    background-repeat: no-repeat; background-position: right 12px center; background-size: 14px;
  }

  .field-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 10px; }
  .field-row .field { margin-bottom: 0; }

  .submit-btn {
    width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #ffffff; border: none; border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25); margin-top: 4px;
  }
  .submit-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
  .app-footnote { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; line-height: 1.5; }

  #successScreen { display: none; padding: 40px 20px; text-align: center; }
  .success-icon { width: 60px; height: 60px; border-radius: 50%; background: #dcfce7; color: var(--success); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; }

  #loadingOverlay {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px);
    align-items: center; justify-content: center; z-index: 2000;
  }
  .loading-card { background: #ffffff; border-radius: 12px; padding: 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  #loadingText { font-size: 13px; color: var(--text-main); font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="app-header">
  <h1>📋 ระบบ Admit Home Ward รพ.สุโขทัย</h1>
  <p>ถ่ายภาพ/เลือกภาพใบนำทาง หรือกรอกข้อมูลเพื่อส่งต่อเคส</p>
</header>

<div class="form-container">
  <form id="caseForm">

    <!-- จุดแยก 2 ปุ่ม: ถ่ายรูปใหม่ vs เลือกจากอัลบั้ม -->
    <div class="card-section" style="padding: 8px;">
      <div class="scanner-actions">
        <label class="scanner-btn" for="cameraInput">
          <span>📷 ถ่ายรูปใหม่</span>
        </label>
        <label class="scanner-btn" for="galleryInput">
          <span>🖼️ เลือกจากอัลบั้ม</span>
        </label>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="galleryInput" accept="image/*" style="display:none;">
      
      <div id="previewContainer">
        <img id="imagePreview" alt="ภาพตัวอย่าง">
      </div>
    </div>

    <!-- ข้อมูลผู้ป่วย -->
    <div class="card-section">
      <div class="field">
        <label>ชื่อ-นามสกุลผู้ป่วย<span class="req">*</span></label>
        <input type="text" id="fullName" required placeholder="ระบุชื่อและนามสกุล">
      </div>

      <div class="field-row">
        <div class="field">
          <label>HN (9 หลัก)<span class="req">*</span></label>
          <input type="text" id="hn" required placeholder="000189452" inputmode="numeric" maxlength="9" pattern="\d{9}">
        </div>
        <div class="field">
          <label>อายุ (ปี)<span class="req">*</span></label>
          <input type="number" id="age" required min="0" max="130" placeholder="เช่น 55">
        </div>
      </div>

      <div class="field">
        <label>สิทธิ์การรักษา<span class="req">*</span></label>
        <select id="rights" required>
          <option value="" disabled selected>เลือกสิทธิ์การรักษา</option>
          <option value="บัตรทอง (UC)">บัตรทอง (UC)</option>
          <option value="ชำระเงินเอง">ชำระเงินเอง</option>
          <option value="ประกันสังคม">ประกันสังคม</option>
          <option value="เบิกตรงข้าราชการ">เบิกตรงข้าราชการ</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>

      <!-- ข้อบ่งชี้แบบ Dropdown -->
      <div class="field">
        <label>ข้อบ่งชี้ Home Ward<span class="req">*</span></label>
        <select id="indication" required>
          <option value="" disabled selected>เลือกข้อบ่งชี้</option>
          <option value="Pressure injury">Pressure injury</option>
          <option value="UTI">UTI</option>
          <option value="Pneumonia">Pneumonia</option>
          <option value="COVID">COVID</option>
          <option value="Active dying">Active dying</option>
        </select>
      </div>

      <div class="field">
        <label>เบอร์โทรศัพท์ติดต่อ<span class="req">*</span></label>
        <input type="tel" id="phone" required placeholder="08X-XXX-XXXX" inputmode="tel">
      </div>
    </div>

    <!-- หน่วยบริการ -->
    <div class="card-section">
      <div class="field">
        <label>หน่วยบริการที่ส่งต่อ<span class="req">*</span></label>
        <select id="setting" required>
          <option value="" disabled selected>เลือกหน่วยบริการ</option>
          <option value="OPD">OPD</option>
          <option value="IPD">IPD</option>
          <option value="ER">ER</option>
        </select>
      </div>

      <div class="field" id="wardField" style="display: none;">
        <label>ระบุ Ward ต้นทาง<span class="req">*</span></label>
        <input type="text" id="ward" placeholder="เช่น อายุรกรรมชาย 1, ตึกศัลยกรรม">
      </div>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">บันทึกและส่งข้อมูล</button>

    <div class="app-footnote">
      โดย กลุ่มงานพยาบาลชุมชน & แพทย์เวชศาสตร์ครอบครัว รพ.สุโขทัย
    </div>
  </form>
</div>

<div id="successScreen">
  <div class="success-icon">✓</div>
  <h2 style="font-size: 18px; margin: 0 0 6px;">ส่งข้อมูลสำเร็จ</h2>
  <p style="font-size: 13.5px; color: var(--text-muted); margin: 0 0 20px;">ทีมงานได้รับข้อมูลเรียบร้อยแล้ว</p>
  <button class="submit-btn" style="width: auto; padding: 10px 24px;" onclick="closeLiff()">ปิด / กรอกเคสใหม่</button>
  <div class="app-footnote" style="margin-top: 24px;">
    โดย กลุ่มงานพยาบาลชุมชน & แพทย์เวชศาสตร์ครอบครัว รพ.สุโขทัย
  </div>
</div>

<div id="loadingOverlay">
  <div class="loading-card">
    <div class="spinner"></div>
    <div id="loadingText">กำลังประมวลผล...</div>
  </div>
</div>

<script>
  const LIFF_ID = "2011323423-D42WYaU4";
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRW0MLygciNZDhpfGjMsmL1BbJxySY9b6nCiFf_vuN4TsDq7YfvXXRYxizw1vuo8Ia/exec
";

  let lineProfile = { userId: "", displayName: "" };

  async function initLiff() {
    try {
      if (typeof liff !== "undefined" && LIFF_ID) {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineProfile.userId = profile.userId;
          lineProfile.displayName = profile.displayName;
        }
      }
    } catch (err) {
      console.log("LIFF Init / Browser mode:", err);
    }
  }
  initLiff();
  
  function closeLiff() {
    if (typeof liff !== "undefined" && liff.isInClient()) {
      liff.closeWindow();
    } else {
      window.location.reload();
    }
  }

  const form = document.getElementById("caseForm");
  const submitBtn = document.getElementById("submitBtn");
  const loadingOverlay = document.getElementById("loadingOverlay");
  const loadingText = document.getElementById("loadingText");
  const settingSelect = document.getElementById("setting");
  const wardField = document.getElementById("wardField");
  const wardInput = document.getElementById("ward");
  const rightsSelect = document.getElementById("rights");
  const indicationSelect = document.getElementById("indication");
  const cameraInput = document.getElementById("cameraInput");
  const galleryInput = document.getElementById("galleryInput");
  const previewContainer = document.getElementById("previewContainer");
  const imagePreview = document.getElementById("imagePreview");

  function alertUCOnly() {
    Swal.fire({
      icon: 'warning',
      title: 'แจ้งเตือนสิทธิ์การรักษา',
      text: 'เฉพาะสิทธิ์ UC รพ.สท.เท่านั้น',
      confirmButtonColor: '#0284c7',
      confirmButtonText: 'ตกลง'
    });
  }

  rightsSelect.addEventListener("change", (e) => {
    if (e.target.value !== "บัตรทอง (UC)") {
      alertUCOnly();
      e.target.value = "";
    }
  });

  settingSelect.addEventListener("change", (e) => {
    if (e.target.value === "IPD") {
      wardField.style.display = "block";
      wardInput.required = true;
    } else {
      wardField.style.display = "none";
      wardInput.required = false;
      wardInput.value = "";
    }
  });

  cameraInput.addEventListener("change", (e) => handleFileSelect(e.target.files[0]));
  galleryInput.addEventListener("change", (e) => handleFileSelect(e.target.files[0]));

  async function handleFileSelect(file) {
    if (!file) return;

    imagePreview.src = URL.createObjectURL(file);
    previewContainer.style.display = "block";

    loadingText.innerText = "กำลังอ่านข้อมูลจากรูปภาพ...";
    loadingOverlay.style.display = "flex";

    try {
      const base64Image = await resizeImage(file, 2048);

      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "ocr_scan",
          imageBase64: base64Image
        })
      });

      const result = await res.json();

      if (result.status === "success" && result.data) {
        const extracted = result.data;
        let filledCount = 0;

        if (extracted.fullName) {
          document.getElementById("fullName").value = extracted.fullName;
          filledCount++;
        }
        if (extracted.hn) {
          document.getElementById("hn").value = extracted.hn;
          filledCount++;
        }
        if (extracted.age) {
          document.getElementById("age").value = extracted.age;
          filledCount++;
        }
        if (extracted.phone) {
          document.getElementById("phone").value = extracted.phone;
          filledCount++;
        }

        let isNonUC = false;
        if (extracted.rights) {
          if (extracted.rights === "บัตรทอง (UC)") {
            rightsSelect.value = "บัตรทอง (UC)";
            filledCount++;
          } else {
            isNonUC = true;
            rightsSelect.value = "";
          }
        }

        if (isNonUC) {
          alertUCOnly();
        } else if (filledCount > 0) {
          Swal.fire({
            icon: 'success',
            title: 'ดึงข้อมูลสำเร็จ',
            text: 'ระบบเติมข้อมูลจากภาพถ่ายให้เรียบร้อย กรุณาตรวจทานความถูกต้อง',
            confirmButtonColor: '#0284c7',
            confirmButtonText: 'ตกลง'
          });
        } else {
          Swal.fire({
            icon: 'info',
            title: 'อ่านภาพได้ แต่ไม่พบข้อมูล',
            text: 'กรุณากรอกข้อมูลเพิ่มเติมด้วยตนเอง',
            confirmButtonColor: '#0284c7',
            confirmButtonText: 'ตกลง'
          });
        }
      } else {
        throw new Error(result.message || "Parse failed");
      }
    } catch (err) {
      console.error("OCR Error:", err);
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาด',
        text: 'ไม่สามารถอ่านข้อความจากภาพได้ กรุณากรอกข้อมูลด้วยตนเอง',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
    } finally {
      loadingOverlay.style.display = "none";
      cameraInput.value = "";
      galleryInput.value = "";
    }
  }

  function resizeImage(file, maxDimension) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDimension) {
              height = Math.round((height *= maxDimension / width));
              width = maxDimension;
            }
          } else {
            if (height > maxDimension) {
              width = Math.round((width *= maxDimension / height));
              height = maxDimension;
            }
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL("image/jpeg", 0.9));
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const rightsVal = rightsSelect.value;
    if (rightsVal !== "บัตรทอง (UC)") {
      alertUCOnly();
      return;
    }

    const hnVal = document.getElementById("hn").value.trim();
    if (!/^\d{9}$/.test(hnVal)) {
      Swal.fire({
        icon: 'warning',
        title: 'เลข HN ไม่ถูกต้อง',
        text: 'กรุณากรอกเลข HN ให้เป็นตัวเลขครบ 9 หลัก',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
      return;
    }

    const indicationVal = indicationSelect.value;
    if (!indicationVal) {
      Swal.fire({
        icon: 'warning',
        title: 'ข้อมูลไม่ครบถ้วน',
        text: 'กรุณาเลือกข้อบ่งชี้ 1 ข้อ',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
      return;
    }

    const payload = {
      userId: lineProfile.userId || "",
      displayName: lineProfile.displayName || "Web Browser",
      fullName: document.getElementById("fullName").value.trim(),
      hn: hnVal,
      age: document.getElementById("age").value,
      rights: rightsVal,
      indication: indicationVal,
      phone: document.getElementById("phone").value.trim(),
      setting: settingSelect.value,
      ward: settingSelect.value === "IPD" ? wardInput.value.trim() : ""
    };

    submitBtn.disabled = true;
    loadingText.innerText = "กำลังบันทึกข้อมูล...";
    loadingOverlay.style.display = "flex";

    try {
      await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      document.querySelector(".form-container").style.display = "none";
      document.querySelector(".app-header").style.display = "none";
      document.getElementById("successScreen").style.display = "block";
    } catch (err) {
      console.error("Submit error", err);
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาด',
        text: 'ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง',
        confirmButtonColor: '#0284c7',
        confirmButtonText: 'ตกลง'
      });
      submitBtn.disabled = false;
    } finally {
      loadingOverlay.style.display = "none";
    }
  });
</script>

</body>
</html>
